[project]
name = "itunes-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pywin32>=312",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project has no build backend yet, so make ``src/`` importable for tests.
pythonpath = ["src"]
# importlib mode lets test files share a basename across folders without __init__.py files.
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not itunes"]
markers = [
    "itunes: integration test that talks to a real iTunes instance (run with: pytest -m itunes)",
]

[tool.ruff]
# PyCharm's default hard wrap ("Hard wrap at") is 120 columns.
line-length = 120
# Classify imports from src/ and tests/ as first-party when sorting.
src = ["src", "tests"]

[tool.ruff.format]
# PEP 8 indentation, as in PyCharm.
indent-style = "space"
# PyCharm doesn't change quotes; double quotes match the existing code.
quote-style = "double"
# Keep a call or collection exploded one-per-line when it ends with a trailing comma,
# like PyCharm keeps manually wrapped code.
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Lint is used only as PyCharm's "Optimize imports": sort imports (I) and remove unused ones (F401).
select = ["I", "F401"]
