# Install once per clone: uv run pre-commit install
# Run on every file:      uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in uv.lock.
    rev: v0.17.6
    hooks:
      - id: ruff-format
        # Check only: fail the commit instead of rewriting files.
        args: [--check, --diff]
      - id: ruff-check
        # Optimize imports (rules selected in pyproject.toml). Reports problems without fixing them.
